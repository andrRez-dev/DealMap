
services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dealmap
      POSTGRES_DB: dealmap
    ports:
      - "127.0.0.1:5432:5432" # Проброс только для локальных GUI-клиентов (DBeaver, DataGrip)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dealmap"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dealmap-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_backend
    restart: always
    working_dir: /var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=dealmap
      - DB_USERNAME=admin
      - DB_PASSWORD=dealmap
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dealmap-net

  webserver:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "8000:8000" # Пробрасываем API Laravel на порт 8000
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - dealmap-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dealmap-net

volumes:
  postgres_data:

networks:
  dealmap-net:
    driver: bridge